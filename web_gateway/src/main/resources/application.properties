server.port=8080
spring.application.name=web_gateway

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

# 唯一超级管理员。部署时必须通过环境变量覆盖默认演示凭据。
gateway.admin.number=${SUPER_ADMIN_NUMBER:9000}
# 使用 Unicode 转义，避免 Java Properties 按 ISO-8859-1 读取 UTF-8 中文后产生乱码。
gateway.admin.name=${SUPER_ADMIN_NAME:\u7CFB\u7EDF\u7BA1\u7406\u5458}
gateway.admin.password=${SUPER_ADMIN_PASSWORD:admin123}

# 区块链存证：未配置时业务照常运行，任务保留为待配置状态。
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:0}
blockchain.explorer-base-url=${BLOCKCHAIN_EXPLORER_BASE_URL:}
blockchain.gas-limit=${BLOCKCHAIN_GAS_LIMIT:100000}
blockchain.worker.delay-ms=${BLOCKCHAIN_WORKER_DELAY_MS:10000}
blockchain.worker.initial-delay-ms=${BLOCKCHAIN_WORKER_INITIAL_DELAY_MS:3000}
